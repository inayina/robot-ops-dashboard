<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
<rect width="1400" height="620" fill="#0d1718"/><style>.t{fill:#f4f7f7;font:700 30px sans-serif}.h{fill:#f4f7f7;font:700 19px sans-serif}.s{fill:#b8c8c8;font:16px sans-serif}.box{fill:#172827;stroke:#5b9f93;stroke-width:2;rx:13}.edge{stroke:#5bdfac;stroke-width:3;fill:none;marker-end:url(#m)}.note{fill:#e5a76f;font:15px sans-serif}</style><defs><marker id="m" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#5bdfac"/></marker></defs>
<text x="55" y="55" class="t">Embedded hardware chain and observability boundary</text><text x="55" y="87" class="s">Reference integration topology — physical acceptance remains separate</text>
<rect x="45" y="160" width="210" height="180" class="box"/><text x="75" y="200" class="h">STM32F411</text><text x="75" y="240" class="s">MPU6050</text><text x="75" y="270" class="s">SensorTask</text><text x="75" y="300" class="s">SensorQueue</text>
<rect x="330" y="160" width="210" height="180" class="box"/><text x="360" y="200" class="h">MotorTask</text><text x="360" y="240" class="s">TB6612 / encoder</text><text x="360" y="270" class="s">command timeout</text><text x="360" y="300" class="s">motor status</text>
<rect x="615" y="160" width="210" height="180" class="box"/><text x="645" y="200" class="h">UART</text><text x="645" y="240" class="s">line buffer</text><text x="645" y="270" class="s">ESP32-S3</text><text x="645" y="300" class="s">micro-ROS</text>
<rect x="900" y="160" width="210" height="180" class="box"/><text x="930" y="200" class="h">ROS 2</text><text x="930" y="240" class="s">/imu/data</text><text x="930" y="270" class="s">/robot/state</text><text x="930" y="300" class="s">/motor/status</text>
<rect x="1185" y="160" width="170" height="180" class="box"/><text x="1215" y="200" class="h">MQTT</text><text x="1215" y="240" class="s">telemetry</text><text x="1215" y="270" class="s">Dashboard</text><text x="1215" y="300" class="s">operator view</text>
<path d="M255 250H320" class="edge"/><path d="M540 250H605" class="edge"/><path d="M825 250H890" class="edge"/><path d="M1110 250H1175" class="edge"/>
<rect x="180" y="440" width="1040" height="90" fill="#2a211b" stroke="#d98f5b" stroke-width="2" rx="12"/><text x="220" y="480" class="note">Boundary</text><text x="330" y="480" class="s">Dashboard observes the chain; it does not become MCU, Nav2, or full-base control authority.</text><text x="220" y="508" class="s">Bench evidence, mock telemetry and physical hardware acceptance must remain separately labelled.</text>
</svg>
